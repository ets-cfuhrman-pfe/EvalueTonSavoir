name: Release - Create Staging Release (RC)

on:
  workflow_dispatch:
    inputs:
      package:
        description: 'Which package to release'
        required: true
        default: client
        type: choice
        options:
          - client
          - server
      release_type:
        description: 'Version bump type'
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major
      release_notes:
        description: 'Release notes (client)'
        required: true
        default: issue
        type: choice
        options:
          - issue
          - none
      notes_issue:
        description: 'Release notes issue # (optional)'
        required: false
        type: string

jobs:
  release-rc:
    runs-on: ubuntu-latest
    # Only allow running from staging branch
    if: github.ref == 'refs/heads/staging'
    permissions:
      contents: write
      issues: write # read the "Notes de version" issue, then comment on and close it
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_ORG_PAT }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Configure Git
        run: |
          git config user.name "${{ secrets.GH_ORG_NAME }}"
          git config user.email "${{ secrets.GH_ORG_EMAIL }}"
      - name: Install dependencies
        run: |
          cd ${{ github.event.inputs.package }}
          npm ci
      - name: Bump version to RC
        id: version
        run: |
          cd ${{ github.event.inputs.package }}
          PACKAGE="${{ github.event.inputs.package }}"
          RELEASE_TYPE="${{ github.event.inputs.release_type }}"
          
          # Bump to prerelease with -rc suffix, respecting release_type input
          # prepatch: 1.0.0 -> 1.0.1-rc.0
          # preminor: 1.0.0 -> 1.1.0-rc.0
          # premajor: 1.0.0 -> 2.0.0-rc.0
          npm version "pre${RELEASE_TYPE}" --preid=rc --git-tag-version=false
          
          VERSION=$(node -p "require('./package.json').version")
          TAG="${PACKAGE}-v${VERSION}"
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT
          echo "TAG=${TAG}" >> $GITHUB_OUTPUT
          echo "PACKAGE=${PACKAGE}" >> $GITHUB_OUTPUT
          echo "REPO_LOWER=${REPO_LOWER}" >> $GITHUB_OUTPUT
      # --- "Nouveautés" release notes (client only) -------------------------
      # The notes are written in a GitHub issue ("Notes de version" issue form) and
      # added to client/src/data/whatsNew.json before the version bump commit, so
      # they ship in the RC image. Any problem fails here, before any push.
      # The issue body is untrusted text: it only ever goes through a file.
      - name: Find "Notes de version" issue
        id: notes_issue
        if: inputs.package == 'client' && inputs.release_notes == 'issue'
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES_ISSUE: ${{ inputs.notes_issue }}
        run: |
          NUMBER="$(echo "$NOTES_ISSUE" | tr -d '[:space:]#')"
          if [ -n "$NUMBER" ]; then
            if ! [[ "$NUMBER" =~ ^[0-9]+$ ]]; then
              echo "::error title=Nouveautés::notes_issue doit être un numéro d'issue (reçu : $NOTES_ISSUE)."
              exit 1
            fi
          else
            OPEN=$(gh issue list --repo "$GITHUB_REPOSITORY" --label notes-de-version --state open --json number -q '.[].number')
            COUNT=$(echo "$OPEN" | grep -c . || true)
            if [ "$COUNT" -gt 1 ]; then
              echo "::error title=Nouveautés::Plusieurs issues « Notes de version » ouvertes ($(echo $OPEN | tr ' ' ',')). Fermez les autres ou précisez notes_issue."
              exit 1
            fi
            NUMBER="$OPEN"
          fi
          if [ -n "$NUMBER" ]; then
            gh issue view "$NUMBER" --repo "$GITHUB_REPOSITORY" --json body -q .body > "$RUNNER_TEMP/notes-issue.md"
            echo "Notes de version : issue #$NUMBER"
          else
            echo "Aucune issue « Notes de version » ouverte."
          fi
          echo "number=$NUMBER" >> "$GITHUB_OUTPUT"

      - name: Update whatsNew.json
        if: inputs.package == 'client'
        run: |
          ISSUE_ARGS=()
          if [ -f "$RUNNER_TEMP/notes-issue.md" ]; then
            ISSUE_ARGS=(--issue-body "$RUNNER_TEMP/notes-issue.md")
          fi
          node .github/scripts/whats-new/update-whats-new.mjs \
            --mode "${{ inputs.release_notes }}" \
            --version "${{ steps.version.outputs.VERSION }}" \
            "${ISSUE_ARGS[@]}" \
            --summary "$GITHUB_STEP_SUMMARY"

      - name: Commit version bump
        run: |
          git add ${{ github.event.inputs.package }}/package.json
          git add ${{ github.event.inputs.package }}/package-lock.json
          if [ "${{ github.event.inputs.package }}" = "client" ] && [ -f client/src/data/whatsNew.json ]; then
            git add client/src/data/whatsNew.json
          fi
          git commit -m "chore(${{ steps.version.outputs.PACKAGE }}): release ${{ steps.version.outputs.VERSION }} [skip ci]"
      - name: Create Git tag
        run: |
          git tag ${{ steps.version.outputs.TAG }}
      - name: Set remote URL for push
        run: |
          git remote set-url origin https://x-access-token:${{ secrets.GH_ORG_PAT }}@github.com/ets-cfuhrman-pfe/EvalueTonSavoir.git
      - name: Push changes and tags
        run: |
          git push origin staging
          git push origin ${{ steps.version.outputs.TAG }}
      - name: Close "Notes de version" issue
        if: steps.notes_issue.outputs.number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ steps.notes_issue.outputs.number }}
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          {
            echo "✅ Ces notes ont été ajoutées à l'application dans la version **client $VERSION** (\`client/src/data/whatsNew.json\`, commit $(git rev-parse --short HEAD) sur \`staging\`)."
            echo ""
            echo "Pour corriger le texte : modifiez cette issue, puis relancez le workflow RC avec \`notes_issue: $NUMBER\`."
          } > "$RUNNER_TEMP/notes-comment.md"
          gh issue comment "$NUMBER" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/notes-comment.md"
          # Already closed when an RC is re-run with notes_issue: that's fine.
          gh issue close "$NUMBER" --repo "$GITHUB_REPOSITORY" --reason completed || true
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GH_ORG_NAME }}
          password: ${{ secrets.GH_ORG_PAT }}

      - name: Build & push Docker image
        uses: docker/build-push-action@v6
        with:
          # Use repo root as context so Dockerfile can COPY both client/ and server/shared
          context: .
          # Specify the Dockerfile depending on selected package
          file: ${{ github.event.inputs.package == 'client' && 'client/Dockerfile' || 'server/Dockerfile' }}
          push: true
          platforms: linux/amd64
          tags: ghcr.io/${{ steps.version.outputs.REPO_LOWER }}-${{ steps.version.outputs.PACKAGE == 'client' && 'frontend' || 'backend' }}:${{ steps.version.outputs.VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create GitHub Release (Pre-release)
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.TAG }}
          name: "${{ steps.version.outputs.PACKAGE }} ${{ steps.version.outputs.VERSION }}"
          body: |
            Release Candidate for ${{ steps.version.outputs.PACKAGE }}
            
            **Version:** ${{ steps.version.outputs.VERSION }}
            **Docker Image:** `ghcr.io/${{ steps.version.outputs.REPO_LOWER }}-${{ steps.version.outputs.PACKAGE == 'client' && 'frontend' || 'backend' }}:${{ steps.version.outputs.VERSION }}`
            **Branch:** staging
          prerelease: true
          draft: false